name: CI / Release

on:
  push:
    branches: [master]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  check:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run

  build:
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          # Linux binaries are static musl builds — no glibc dependency, so
          # they run on any distro (Debian, older Ubuntu, slim containers).
          # A glibc build picks up the CI runner's glibc and breaks anywhere
          # older than it.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: kondi-tui-linux-x64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            artifact: kondi-tui-linux-arm64
            cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: kondi-tui-darwin-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: kondi-tui-darwin-arm64
          # Native Windows is not supported — Windows users run under WSL,
          # which is a Linux environment and uses the linux-x64 binary.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux x64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross (Linux ARM64)
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (native)
        if: "!matrix.cross"
        working-directory: tui
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (cross-compile)
        if: matrix.cross
        working-directory: tui
        run: cross build --release --target ${{ matrix.target }}

      # Upload the raw binary (used by the npm postinstall script).
      - name: Rename binary
        run: |
          cp tui/target/${{ matrix.target }}/release/kondi-tui ${{ matrix.artifact }}
          chmod +x ${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            ## Install

            ```bash
            npm install -g @thispointon/kondi-chat
            ```

            The postinstall script automatically downloads the TUI binary
            for your platform. If you prefer manual install, download the
            binary for your OS from the assets below and place it at
            `tui/target/release/kondi-tui` in a cloned repo.

  publish-npm:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      # id-token: write is required for npm OIDC trusted publishing.
      # No NPM_TOKEN is used — npm trusts this workflow directly. Configure
      # the trusted publisher once at npmjs.com/package/.../access.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 22 ships npm 10.9+; npm 11.5+ is required for trusted-publisher
          # OIDC, so upgrade npm explicitly before publish.
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm publish --provenance --access public
